    </g>
    <g id="middle-sheets">
      <path d="M147 230Q191 200 217 210L306 189Q325 229 359 245L387 269Q347 287 325 304Q260 283 190 304L137 288Q155 263 147 230Z" fill="#e6dbc5"/>
      <path d="M143 278L190 292Q261 272 326 292L370 275M166 278Q195 286 222 279" fill="none" stroke-width="1.9"/>
      <path d="M127 212Q171 209 199 181Q242 204 290 192L330 183Q339 222 365 232L343 268Q302 252 261 282Q207 276 153 259Q160 233 127 212Z" fill="#fffaef"/>
      <path d="M127 212Q154 226 170 223L153 259Q154 235 127 212Z" fill="#d7cbb4" stroke-width="2.2"/>
