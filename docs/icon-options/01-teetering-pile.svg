<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <title>Heap option 1: teetering pile</title>
  <desc>A tall, leaning heap of bent loose sheets, viewed from the side. A blue note slips over its right shoulder. Pencil-like outlines and hatching on warm cream.</desc>
  <defs>
    <!-- Cream paper, charcoal graphite and cobalt blue echo the supplied reference. -->
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(22)">
      <path d="M1 0L0 7 M4 1L3 6" stroke="#635c4c" stroke-width=".7" opacity=".38"/>
    </pattern>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".095" numOctaves="3" seed="19" result="wobble"/>
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="2.6" xChannelSelector="R" yChannelSelector="G" result="drawn"/>
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="8" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="monoGrain"/>
      <feComponentTransfer><feFuncA type="linear" slope=".23"/></feComponentTransfer>
      <feComposite in2="drawn" operator="in" result="paperGrain"/>
      <feBlend in="drawn" in2="paperGrain" mode="multiply" result="shaded"/>
      <feComponentTransfer in="monoGrain">
        <feFuncR type="discrete" tableValues="0 0 1 1"/>
        <feFuncG type="discrete" tableValues="0 0 1 1"/>
        <feFuncB type="discrete" tableValues="0 0 1 1"/>
        <feFuncA type="linear" slope=".3"/>
      </feComponentTransfer>
      <feComposite in2="drawn" operator="in" result="graphiteGrain"/>
      <feBlend in="shaded" in2="graphiteGrain" mode="screen"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#faf7f0"/>
  <!-- All sheets are separate editable paths; the pile is seen above a low ground line. -->
  <g id="ground" stroke="#595347" fill="none" stroke-linecap="round" opacity=".26">
    <path d="M90 440Q201 450 407 440 M117 446Q236 453 371 447" stroke-width="2"/>
    <path d="M127 437l-14 6m32-7-14 9m35-7-11 8m31-9-9 9m31-8-7 8m31-8-6 8m30-8-6 8m30-9-8 9m30-10-8 8m27-10-9 10m27-11-8 8"/>
  </g>
  <g id="artwork" filter="url(#pencil)" stroke="#282723" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round">
    <g id="foundation">
      <path d="M100 384Q158 364 231 367L337 351Q355 387 405 406L420 430Q354 419 295 441Q220 454 169 433L86 426Q103 407 100 384Z" fill="#eee6d5"/>
