      <path d="M105 381Q117 388 125 400L94 413" fill="#e2d8c2" stroke-width="2.2"/>
    </g>
    <g id="lower-sheets">
      <path d="M125 313Q201 291 248 310L352 292Q366 332 400 358L369 385Q310 368 264 391Q194 407 116 378Q135 351 125 313Z" fill="#e9dfcb"/>
      <path d="M118 371Q203 396 264 380Q319 358 384 374M130 364Q205 385 264 370" fill="none" stroke-width="1.9"/>
      <path d="M112 300L170 263Q215 286 278 274L342 254Q361 293 399 318Q372 326 354 347Q307 331 266 362Q208 379 131 348L100 354Q117 333 112 300Z" fill="#fffaf0"/>
