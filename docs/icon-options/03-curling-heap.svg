<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <title>Heap option 3: curling heap</title>
  <desc>A loose heap of creased and curling sheets in three-quarter elevation. A high buckled sheet rises above scattered edges; a blue note curls across the front-right side.</desc>
  <defs>
    <!-- The reference supplies the warm paper, black pencil and vivid blue palette. -->
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <path d="M1 0L0 7 M4 1L3 6" stroke="#625a49" stroke-width=".75" opacity=".4"/>
    </pattern>
    <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".095" numOctaves="3" seed="32" result="wobble"/>
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="2.6" xChannelSelector="R" yChannelSelector="G" result="drawn"/>
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="14" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="monoGrain"/>
      <feComponentTransfer><feFuncA type="linear" slope=".23"/></feComponentTransfer>
      <feComposite in2="drawn" operator="in" result="paperGrain"/>
      <feBlend in="drawn" in2="paperGrain" mode="multiply" result="shaded"/>
      <feComponentTransfer in="monoGrain">
        <feFuncR type="discrete" tableValues="0 0 1 1"/>
        <feFuncG type="discrete" tableValues="0 0 1 1"/>
        <feFuncB type="discrete" tableValues="0 0 1 1"/>
        <feFuncA type="linear" slope=".3"/>
      </feComponentTransfer>
      <feComposite in2="drawn" operator="in" result="graphiteGrain"/>
      <feBlend in="shaded" in2="graphiteGrain" mode="screen"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#faf7f0"/>
