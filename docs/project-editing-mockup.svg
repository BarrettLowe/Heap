<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1240" height="1060" viewBox="0 0 1240 1060" role="img" aria-labelledby="title desc">
  <title id="title">Heap project management proposal: list, editor, permanent deletion</title>
  <desc id="desc">3 phone-scale screens at 360 by 800 logical pixels. Projects rows show color, icon, and name. Add project is separate from the central Capture task plus. The editor has Project name, Color, Icon, 1 Save, and Delete project. The deletion dialog warns that ALL assigned tasks, including completed tasks, are permanently deleted, with Cancel initially focused. Property, Garden, and Workshop are illustrative names only. Picker values and hand-drawn glyphs are proposals, not implemented support.</desc>
  <!-- Heap colors and dimensions come from current style/widgets. Dialog red/pale surface
       are illustrative Material roles; 360x800 panels and outer spacing are mockup layout. -->
  <defs>
    <style>
      text { font-family: Roboto, Arial, sans-serif; fill: #102E24; }
      .heading { font-size: 30px; font-weight: 800; }
      .app-title { font-size: 24px; font-weight: 800; }
      .name { font-size: 18px; font-weight: 700; fill: #171C19; }
      .body { font-size: 16px; }
      .label { font-size: 12px; fill: #646D67; }
      .note { font-size: 14px; fill: #646D67; }
      .button { font-size: 14px; font-weight: 600; }
      .white { fill: white; }
      .muted { fill: #646D67; }
      .stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="mountain">
      <path d="M0 32 L17 0 Q19 -1 20 3 L26 10 L8 32Z" fill="#52875B"/>
      <path d="M14 32 L28 10 Q30 8 32 11 L40 32Z" fill="#365F47"/>
    </g>
    <!-- Glyph sketches illustrate shape/placement only, not an existing MDI renderer. -->
    <g id="folder" class="stroke" color="#102E24"><path d="M2 6H9L12 9H22V20H2Z"/></g>
    <g id="home" class="stroke" color="#102E24"><path d="M2 11L12 3L22 11M5 9V21H10V15H14V21H19V9"/></g>
    <g id="leaf" class="stroke" color="#102E24"><path d="M4 19C0 8 10 3 21 3C21 14 16 22 6 19M3 22L16 9"/></g>
    <g id="tools" class="stroke" color="#102E24"><path d="M15 3A6 6 0 0 0 10 11L3 18Q1 21 4 22L13 14A6 6 0 0 0 21 6L17 10L14 7Z"/></g>
    <g id="trash" class="stroke"><path d="M4 6H20M9 6V3H15V6M6 6L7 21H17L18 6M10 10V17M14 10V17"/></g>
    <g id="back" class="stroke" color="#102E24"><path d="M20 12H4M11 5L4 12L11 19"/></g>
    <g id="refresh" class="stroke" color="#102E24"><path d="M21 5V11H15M20 10A9 9 0 1 0 20 17"/></g>
    <g id="list-icon" class="stroke" color="#102E24"><path d="M8 6H22M8 12H22M8 18H22"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></g>
    <g id="calendar" class="stroke" color="#646D67"><rect x="3" y="5" width="18" height="17" rx="1"/><path d="M3 10H21M7 2V7M17 2V7"/></g>
    <g id="chart" fill="#102E24"><rect x="3" y="11" width="4" height="11" rx="2"/><rect x="10" y="3" width="4" height="19" rx="2"/><rect x="17" y="15" width="4" height="7" rx="2"/></g>
    <g id="gear" class="stroke" color="#646D67"><path d="M9 2H15L16 6L20 7L22 12L19 15V19L14 22L10 19H6L3 14L5 10V6Z"/><circle cx="12" cy="12" r="3"/></g>
    <g id="chevron"><path d="M0 0L5 5L10 0Z" fill="#646D67"/></g>
    <g id="system">
      <text x="16" y="22" font-size="12">9:41</text>
      <path d="M292 20V17M297 20V14M302 20V10" stroke="#102E24" stroke-width="3"/>
      <rect x="321" y="11" width="22" height="11" rx="2" fill="#102E24"/><path d="M344 14V19" stroke="#102E24" stroke-width="2"/>
      <rect x="132" y="786" width="96" height="4" rx="2" fill="#646D67"/>
    </g>
    <g id="editor">
      <rect width="360" height="800" rx="24" fill="#FCFCF8"/>
      <use xlink:href="#system"/>
      <use xlink:href="#back" x="20" y="44"/>
      <text x="64" y="65" class="app-title">Edit project</text>
      <rect x="16" y="126" width="328" height="64" rx="4" fill="white" stroke="#646D67"/>
      <rect x="27" y="118" width="88" height="17" fill="white"/>
      <text x="32" y="130" class="label">Project name</text>
      <text x="32" y="164" class="body">Property</text>
      <rect x="16" y="206" width="328" height="56" rx="4" fill="white" stroke="#646D67"/>
      <rect x="27" y="198" width="38" height="17" fill="white"/>
      <text x="32" y="210" class="label">Color</text>
      <circle cx="43" cy="235" r="9" fill="#285A46"/>
      <text x="64" y="240" class="body">Green</text>
      <use xlink:href="#chevron" x="315" y="232"/>
      <rect x="16" y="278" width="328" height="56" rx="4" fill="white" stroke="#646D67"/>
      <rect x="27" y="270" width="31" height="17" fill="white"/>
      <text x="32" y="282" class="label">Icon</text>
      <use xlink:href="#home" x="32" y="295"/>
      <text x="64" y="312" class="body">Home</text>
      <use xlink:href="#chevron" x="315" y="304"/>
      <g color="#BA1A1A"><use xlink:href="#trash" x="28" y="385"/></g>
      <text x="64" y="402" class="button" style="fill:#BA1A1A">Delete project</text>
      <path d="M0 700H360" stroke="#DFE4DE"/>
      <rect x="16" y="720" width="328" height="48" rx="24" fill="#285A46"/>
      <text x="180" y="749" text-anchor="middle" class="button white">Save</text>
    </g>
    <clipPath id="phone-clip"><rect width="360" height="800" rx="24"/></clipPath>
  </defs>

  <rect width="1240" height="1060" fill="#F1F2EC"/>
  <text x="40" y="42" font-size="26" font-weight="800">Heap · Project management</text>
  <text x="40" y="69" class="note">Design proposal only · 360 × 800 logical-pixel screens · Names are illustrative, not seeded projects.</text>
  <text x="40" y="102" class="button">1 · Projects list</text>
  <text x="440" y="102" class="button">2 · Edit project</text>
  <text x="840" y="102" class="button">3 · Permanent deletion</text>

  <g transform="translate(40 120)">
    <rect width="360" height="800" rx="24" fill="#FCFCF8"/>
    <use xlink:href="#system"/>
    <use xlink:href="#mountain" x="16" y="50"/>
    <text x="68" y="80" font-size="32" font-weight="800">Heap</text>
    <use xlink:href="#refresh" x="316" y="52"/>
    <text x="16" y="155" class="heading">Projects</text>
    <rect x="16" y="178" width="156" height="48" rx="24" fill="#285A46"/>
    <path d="M33 202H49M41 194V210" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="207" class="button white">Add project</text>

    <circle cx="28" cy="279" r="6" fill="#285A46"/>
    <use xlink:href="#home" x="46" y="267"/>
    <text x="82" y="286" class="name">Property</text>
    <path d="M82 312H332" stroke="#DFE4DE"/>
    <circle cx="28" cy="351" r="6" fill="#779252"/>
    <use xlink:href="#leaf" x="46" y="339"/>
    <text x="82" y="358" class="name">Garden</text>
    <path d="M82 384H332" stroke="#DFE4DE"/>
    <circle cx="28" cy="423" r="6" fill="#468BBB"/>
    <use xlink:href="#tools" x="46" y="411"/>
    <text x="82" y="430" class="name">Workshop</text>
    <path d="M82 456H332" stroke="#DFE4DE"/>

    <path d="M0 674H360" stroke="#DFE4DE"/>
    <use xlink:href="#list-icon" x="20" y="701"/>
    <text x="32" y="744" text-anchor="middle" class="label">Tasks</text>
    <use xlink:href="#calendar" x="92" y="701"/>
    <text x="104" y="744" text-anchor="middle" class="label">Today</text>
    <text x="104" y="760" text-anchor="middle" font-size="10" class="muted">Soon</text>
    <circle cx="180" cy="716" r="32" fill="#285A46"/>
    <path d="M166 716H194M180 702V730" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text x="180" y="769" text-anchor="middle" font-size="12">Capture</text>
    <rect x="226" y="693" width="52" height="36" rx="18" fill="#EFF3E7"/>
    <use xlink:href="#chart" x="240" y="699"/>
    <text x="252" y="744" text-anchor="middle" font-size="12" font-weight="600">Projects</text>
    <use xlink:href="#gear" x="312" y="701"/>
    <text x="324" y="744" text-anchor="middle" class="label">Settings</text>
    <text x="324" y="760" text-anchor="middle" font-size="10" class="muted">Soon</text>
    <rect width="360" height="800" rx="24" fill="none" stroke="#CFD6CE"/>
  </g>

  <g transform="translate(440 120)">
    <use xlink:href="#editor"/>
    <rect width="360" height="800" rx="24" fill="none" stroke="#CFD6CE"/>
  </g>

  <g transform="translate(840 120)">
    <use xlink:href="#editor"/>
    <g clip-path="url(#phone-clip)">
      <rect width="360" height="800" fill="black" opacity="0.48"/>
      <!-- Pale surface follows the current Material dialog appearance. Stacked actions
           leave both labels comfortable at phone width; Cancel owns initial focus. -->
      <rect x="24" y="244" width="312" height="342" rx="28" fill="#E4EBE5"/>
      <text x="48" y="285" font-size="24">Delete project?</text>
      <text x="48" y="326" font-size="14">
        <tspan x="48">This permanently deletes "Property"</tspan>
        <tspan x="48" dy="22" font-weight="700">and ALL tasks assigned to it,</tspan>
        <tspan x="48" dy="22">including completed tasks.</tspan>
        <tspan x="48" dy="34" font-weight="600">This cannot be undone.</tspan>
      </text>
      <rect x="48" y="446" width="264" height="48" rx="24" fill="#FCFCF8" stroke="#285A46" stroke-width="2"/>
      <text x="180" y="475" text-anchor="middle" class="button" style="fill:#285A46">Cancel</text>
      <rect x="48" y="510" width="264" height="48" rx="24" fill="#BA1A1A"/>
      <text x="180" y="539" text-anchor="middle" class="button white">Delete project</text>
    </g>
    <rect width="360" height="800" rx="24" fill="none" stroke="#CFD6CE"/>
  </g>

  <text x="40" y="948" class="note">Row tap → Edit project.</text>
  <text x="40" y="970" class="note">Add project → same form, blank name.</text>
  <text x="40" y="992" class="note">Central plus always captures a task.</text>
  <text x="440" y="948" class="note">Add: Color / Icon default to None (proposal).</text>
  <text x="440" y="970" class="note">Small single-selection dropdowns; draft only.</text>
  <text x="440" y="992" class="note">Save once. Delete only on existing projects.</text>
  <text x="840" y="948" class="note">Cancel has initial focus; Enter cancels.</text>
  <text x="840" y="970" class="note">Back / Escape / outside tap cancel.</text>
  <text x="840" y="992" class="note">Deletion is permanent. There is no Undo.</text>
  <text x="40" y="1034" class="label">Glyphs are sketches; MDI choices and color palette are proposals. Full behavior and responsive notes: project-editing-design.md.</text>
</svg>
