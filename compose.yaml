services:
  heap:
    build: .
    restart: unless-stopped
    environment:
      HEAP_DATABASE_PATH: /data/heap.sqlite
      HEAP_CORS_ORIGINS: ${HEAP_CORS_ORIGINS:-[]}
    ports:
      - "${HEAP_BIND_ADDRESS:-127.0.0.1}:${HEAP_PORT:-8000}:8000"
    volumes:
      - heap-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  heap-data:
