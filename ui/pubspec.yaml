name: heap_app
description: "Heap inbox client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE.txt
    - assets/fonts/APACHE-2.0.txt
  fonts:
    - family: HeapProjectIcons
      fonts:
        - asset: assets/fonts/heap-project-icons.ttf
